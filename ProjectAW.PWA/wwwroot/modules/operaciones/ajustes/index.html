<!doctype html>
<html lang="es"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#073d78">
  <title>Ajustes de lectura | Proyecto AW</title>
  <link rel="stylesheet" href="/libs/bootstrap/bootstrap.min.css"><link rel="stylesheet" href="/css/site.css"><link rel="stylesheet" href="/modules/operaciones/operaciones.css">
  <script src="/config/api-config.js"></script><script type="module" src="/modules/operaciones/ajustes/ajustes.js"></script>
</head>
    <body class="operations-page">
        <main class="operations-shell">
            <header class="operations-header">
                <a class="operations-brand" href="/modules/operaciones/inicio/index.html">
                    <span class="brand-mark" aria-hidden="true">AW</span>
                    <span><strong>Proyecto AW</strong>
                        <small>Ajustes del operador</small>
                    </span>
                </a>
                    <button class="btn btn-outline-primary logout-button" id="logout-button" type="button">Cerrar sesión</button>
            </header>
  
        <section class="settings-page">
            <a class="guides-back" href="/modules/operaciones/inicio/index.html">← Inicio</a>
            <p class="eyebrow">PREFERENCIAS</p>
            <h1>Ajustes de lectura</h1>
            <p class="settings-intro">Elige el método que usarás para capturar códigos. Puedes escribirlos manualmente en ambos modos.</p>
    
            <fieldset class="capture-options"><legend>Método de captura</legend>
                <label class="capture-option">
                    <input type="radio" name="capture-mode" value="pda">
                    <span class="capture-option-icon" aria-hidden="true">▥</span>
                    <span>
                        <strong>Lector PDA</strong>
                        <small>Escáner conectado como teclado. Presiona Enter para avanzar.</small>
                    </span>
                </label>
                
            <label class="capture-option">
                <input type="radio" name="capture-mode" value="camera">
                <span class="capture-option-icon" aria-hidden="true">▣</span>
                <span>
                    <strong>Cámara</strong>
                    <small>Usa la cámara del dispositivo cuando abras un registro.</small>
                </span>
            </label>
            
            </fieldset>
    
            <p id="settings-status" class="settings-status" role="status" aria-live="polite"></p>
        </section>
        <footer class="operations-footer">© <span id="current-year"></span> Proyecto AW</footer>
        </main>
    </body>
</html>
