<!doctype html>
<html lang="es"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#073d78">
  <title>Ajustes de lectura | Proyecto AW</title>
  <link rel="stylesheet" href="/libs/bootstrap/bootstrap.min.css"><link rel="stylesheet" href="/css/site.css"><link rel="stylesheet" href="/modules/operaciones/operaciones.css">
  <script src="/config/api-config.js"></script><script type="module" src="/modules/operaciones/ajustes/ajustes.js"></script>
</head>
    <body class="operations-page">
        <main class="operations-shell">
            <header class="operations-header">
                <a class="operations-brand" href="/modules/operaciones/inicio/index.html">
                    <span class="brand-mark" aria-hidden="true">AW</span>
                    <span><strong>Proyecto AW</strong>
                        <small>Ajustes del operador</small>
                    </span>
                </a>
            </header>
  
        <section class="settings-page">
            <a class="guides-back" href="/modules/operaciones/inicio/index.html"><i class="ti ti-arrow-left" aria-hidden="true"></i> Inicio</a>
            <p class="eyebrow">PREFERENCIAS</p>
            <h1>Ajustes de lectura</h1>
            <p class="settings-intro">Elige el método que usarás para capturar códigos. Puedes escribirlos manualmente en ambos modos.</p>
    
            <fieldset class="capture-options"><legend>Método de captura</legend>
                <label class="capture-option form-check">
                    <input type="radio" name="capture-mode" value="pda" class="form-check-input">
                    <i class="capture-option-icon ti ti-barcode" aria-hidden="true"></i>
                    <span>
                        <strong>Lector PDA</strong>
                        <small>Escáner conectado como teclado. Presiona Enter para avanzar.</small>
                    </span>
                </label>
                
            <label class="capture-option form-check">
                <input type="radio" name="capture-mode" value="camera" class="form-check-input">
                <i class="capture-option-icon ti ti-camera" aria-hidden="true"></i>
                <span>
                    <strong>Cámara</strong>
                    <small>Usa la cámara del dispositivo cuando abras un registro.</small>
                </span>
            </label>
            
            </fieldset>

            <fieldset class="capture-options"><legend>Informaciones adicionales</legend>
                <label class="capture-option form-check">
                    <input id="lot-enabled" type="checkbox" class="form-check-input">
                    <i class="capture-option-icon ti ti-box" aria-hidden="true"></i>
                    <span><strong>Lote</strong><small>Mostrar el campo Lote en el paso Productos.</small></span>
                </label>
                <label class="capture-option form-check">
                    <input id="serial-enabled" type="checkbox" class="form-check-input">
                    <i class="capture-option-icon ti ti-barcode" aria-hidden="true"></i>
                    <span><strong>Serie</strong><small>Mostrar el campo Serie en el paso Productos.</small></span>
                </label>
                <label class="capture-option form-check">
                    <input id="expiry-enabled" type="checkbox" class="form-check-input">
                    <i class="capture-option-icon ti ti-calendar" aria-hidden="true"></i>
                    <span><strong>Fch. vencimiento</strong><small>Mostrar la fecha en Productos como referencia visual.</small></span>
                </label>
            </fieldset>

            <button class="btn btn-outline-danger settings-signout" id="logout-button" type="button"><i class="ti ti-logout inline-icon" aria-hidden="true"></i>Cerrar sesión</button>
    
            <p id="settings-status" class="settings-status" role="status" aria-live="polite"></p>
        </section>
        <footer class="operations-footer">© <span id="current-year"></span> Proyecto AW</footer>
        </main>
    </body>
</html>
