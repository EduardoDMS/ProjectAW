<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#073d78">
  <meta name="description" content="Guías asignadas al operador autenticado">
  <title>Mis guías | Proyecto AW</title>
  <link rel="stylesheet" href="/libs/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/css/site.css">
  <link rel="stylesheet" href="/modules/operaciones/operaciones.css">
  <script src="/config/api-config.js"></script>
  <script type="module" src="/modules/operaciones/guias/mis-guias.js"></script>
</head>
<body class="operations-page">
  <main class="operations-shell">
    <header class="operations-header">
      <a class="operations-brand" href="/modules/operaciones/inicio/index.html" aria-label="Volver al inicio de Proyecto AW">
        <span class="brand-mark" aria-hidden="true">AW</span>
        <span><strong>Proyecto AW</strong><small>Operaciones de almacén</small></span>
      </a>
    </header>

    <section class="my-guides-page" aria-labelledby="my-guides-title" aria-busy="true">
      <a class="guides-back" href="/modules/operaciones/inicio/index.html"><i class="ti ti-arrow-left" aria-hidden="true"></i> Inicio</a>
      <p class="eyebrow">ESPACIO DEL OPERADOR</p>
      <h1 id="my-guides-title">Mis guías</h1>
      <p class="my-guides-page__intro">Solo aparecen las guías que tomaste con tu usuario.</p>
      <div class="my-guides-tabs" role="tablist" aria-label="Estado de mis guías">
        <button type="button" role="tab" id="tab-in-process" aria-selected="true" data-status="2" class="btn">En proceso</button>
        <button type="button" role="tab" id="tab-completed" aria-selected="false" data-status="3" class="btn">Terminadas</button>
      </div>
      <p id="my-guides-status" class="visually-hidden" role="status" aria-live="polite">Cargando tus guías…</p>
      <div id="my-guides-message" class="alert d-none" role="alert"></div>
      <ul id="my-guides-list" class="guides-list" aria-busy="true"></ul>
    </section>

    <footer class="operations-footer">© <span id="current-year"></span> Proyecto AW</footer>
  </main>
</body>
</html>
