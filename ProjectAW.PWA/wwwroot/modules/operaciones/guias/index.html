<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#073d78">
  <meta name="description" content="Guías pendientes de operaciones de Proyecto AW">
  <title>Guías | Proyecto AW</title>
  <link rel="stylesheet" href="/libs/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/css/site.css">
  <link rel="stylesheet" href="/modules/operaciones/operaciones.css">
  <script src="/config/api-config.js"></script>
  <script type="module" src="/modules/operaciones/guias/listado.js"></script>
</head>
<body class="operations-page">
  <main class="operations-shell">
    <header class="operations-header">
      <a class="operations-brand" href="/modules/operaciones/inicio/index.html" aria-label="Volver al inicio de Proyecto AW">
        <span class="brand-mark" aria-hidden="true">AW</span>
        <span><strong>Proyecto AW</strong><small>Operaciones de almacén</small></span>
      </a>
    </header>

    <section class="guides-content" aria-labelledby="guides-title">
      <a class="guides-back" href="/modules/operaciones/inicio/index.html"><i class="ti ti-arrow-left" aria-hidden="true"></i> Inicio</a>
      <div class="guides-title-row">
        <div>
          <p id="operation-eyebrow" class="eyebrow">GUÍAS PENDIENTES</p>
          <h1 id="guides-title">Guías</h1>
          <p id="guides-subtitle">Ordenadas por hora programada.</p>
        </div>
        <span id="guides-count" class="guides-count" aria-live="polite">Cargando…</span>
      </div>
      <p id="guides-status" class="visually-hidden" role="status" aria-live="polite">Cargando guías desde la API…</p>
      <div id="guides-message" class="alert d-none" role="alert"></div>
      <ul id="guides-list" class="guides-list" aria-busy="true"></ul>
    </section>

    <footer class="operations-footer">© <span id="current-year"></span> Proyecto AW</footer>
  </main>
  <dialog id="take-guide-confirmation" class="guide-confirmation" aria-labelledby="take-guide-title">
    <form method="dialog">
      <p class="eyebrow">CONFIRMACIÓN</p>
      <h2 id="take-guide-title">¿Deseas atender esta guía?</h2>
      <p>Se asignará a tu usuario para iniciar la lectura.</p>
      <dl class="guide-confirmation-details">
        <div><dt>Guía</dt><dd id="confirm-guide-code"></dd></div>
        <div><dt>Fecha</dt><dd id="confirm-guide-date"></dd></div>
      </dl>
      <div class="guide-confirmation-actions">
        <button class="btn btn-outline-secondary" value="cancel">Cancelar</button>
        <button id="confirm-take-guide" class="btn btn-primary" value="confirm">Sí, atender</button>
      </div>
    </form>
  </dialog>
</body>
</html>
