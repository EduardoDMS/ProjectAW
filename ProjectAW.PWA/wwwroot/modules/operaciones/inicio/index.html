<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#073d78">
  <meta name="description" content="Inicio de operaciones de almacén de Proyecto AW">
  <title>Operaciones | Proyecto AW</title>
  <link rel="stylesheet" href="/libs/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/css/site.css">
  <link rel="stylesheet" href="/modules/operaciones/operaciones.css">
  <script src="/config/api-config.js"></script>
  <script type="module" src="/modules/operaciones/inicio/home.js"></script>
</head>
<body class="operations-page">
  <main class="operations-shell">
    <header class="operations-header">
      <a class="operations-brand" href="/modules/operaciones/inicio/index.html" aria-label="Inicio de Proyecto AW">
        <span class="brand-mark" aria-hidden="true">AW</span>
        <span><strong>Proyecto AW</strong><small>Operaciones de almacén</small></span>
      </a>
      <button class="btn btn-outline-primary logout-button" id="logout-button" type="button">Cerrar sesión</button>
    </header>

    <section class="home-content" aria-labelledby="home-title">
      <p class="eyebrow">ESPACIO DE TRABAJO</p>
      <h1 id="home-title">¿Qué operación realizarás?</h1>
      <p class="home-intro">Selecciona un módulo para consultar las guías pendientes.</p>
      <a class="my-guides-shortcut" href="/modules/operaciones/guias/mis-guias.html">
        <span class="my-guides-shortcut__icon" aria-hidden="true">✓</span>
        <span><strong>Mis guías</strong><small>Continúa una lectura o consulta tus guías terminadas.</small></span>
        <span class="my-guides-shortcut__arrow" aria-hidden="true">→</span>
      </a>
      <p id="home-status" class="visually-hidden" role="status" aria-live="polite">Cargando pendientes desde la API…</p>
      <div id="operation-cards" class="operation-grid" aria-busy="true"></div>
      <div id="home-message" class="alert d-none" role="alert"></div>
    </section>

    <footer class="operations-footer">© <span id="current-year"></span> Proyecto AW</footer>
  </main>
</body>
</html>
