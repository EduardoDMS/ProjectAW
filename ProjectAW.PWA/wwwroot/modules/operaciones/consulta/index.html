<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#073d78"><meta name="description" content="Consulta de existencias por producto o ubicación">
  <title>Consulta de stock | Proyecto AW</title>
  <link rel="stylesheet" href="/libs/bootstrap/bootstrap.min.css"><link rel="stylesheet" href="/css/site.css">
  <link rel="stylesheet" href="/modules/operaciones/operaciones.css">
  <script src="/config/api-config.js"></script><script type="module" src="/modules/operaciones/consulta/consulta.js"></script>
</head>
<body class="operations-page">
  <main class="operations-shell">
    <header class="operations-header">
      <a class="operations-brand" href="/modules/operaciones/inicio/index.html"><span class="brand-mark" aria-hidden="true">AW</span><span><strong>Proyecto AW</strong><small>Consulta de inventario</small></span></a>
      <a class="btn btn-outline-primary" href="/modules/operaciones/guias/mis-guias.html">Mis guías</a>
    </header>
    <section class="stock-consult-page" aria-labelledby="stock-consult-title">
      <p class="eyebrow">INVENTARIO</p><h1 id="stock-consult-title">Consultar existencias</h1>
      <p class="stock-consult-intro">Escanea o escribe un código para revisar productos y ubicaciones.</p>
      <div class="stock-consult-mode" role="group" aria-label="Tipo de consulta">
        <button type="button" data-mode="product" aria-pressed="true">Producto</button>
        <button type="button" data-mode="location" aria-pressed="false">Ubicación</button>
      </div>
      <form id="stock-consult-form" class="stock-consult-form">
        <label for="stock-consult-code" id="stock-consult-label">Código del producto</label>
        <div><input id="stock-consult-code" autocomplete="off" inputmode="text" placeholder="Escanea o escribe el código" required><button class="btn btn-primary" type="submit">Consultar</button></div>
      </form>
      <p id="stock-consult-status" class="stock-consult-status" role="status" aria-live="polite"></p>
      <div id="stock-consult-results" class="stock-consult-results"></div>
    </section>
    <footer class="operations-footer">© <span id="current-year"></span> Proyecto AW</footer>
  </main>
</body>
</html>
